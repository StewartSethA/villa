[project]
name = "tifxyz-tools"
version = "0.2.0"
description = "Surface-level tools for tifxyz segments: same-sheet estimator, growth guard, guarded-grow driver"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "tifffile", "zarr"]

[project.optional-dependencies]
tests = ["pytest"]

[project.scripts]
guarded-grow = "tifxyz_tools.guarded_grow:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tifxyz_tools"]
